[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "solarman-hub"
dynamic = ["version"]
description = "Local Solarman V5 receiver, cloud forwarding and Home Assistant MQTT bridge"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.14,<4", "pydantic>=2.11,<3", "paho-mqtt>=2.1,<3",
  "markdown-it-py>=3,<5", "tzdata>=2025.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1", "playwright>=1.50", "jinja2>=3.1,<4"]

[project.scripts]
solarman-hub = "solarman_hub.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solarman_hub = ["static/*", "builtin_profiles/*.json", "guides/*.md", "firmware/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = {attr = "solarman_hub.__version__"}
